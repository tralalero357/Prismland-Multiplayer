<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prismland</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--ink:#fff;--glass:rgba(20,14,48,.55);--line:rgba(255,255,255,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1b1340;font-family:'Pixelify Sans',ui-monospace,monospace;color:var(--ink)}
canvas{display:block;width:100%;height:100%}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:var(--glass);backdrop-filter:blur(8px);border:2px solid var(--line);border-radius:10px;max-width:96vw}
.slot{image-rendering:pixelated;background-size:cover;width:44px;height:44px;border:2px solid rgba(255,255,255,.25);border-radius:6px;cursor:pointer;position:relative;flex:none}
.slot.on{border-color:#fff;transform:translateY(-8px) scale(1.12);box-shadow:0 0 0 2px #000,0 8px 18px rgba(0,0,0,.4)}
.slot i{position:absolute;left:3px;top:1px;font:700 11px 'Pixelify Sans',monospace;font-style:normal;text-shadow:0 1px 2px #000}
#name{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:20px;text-shadow:0 2px 6px #000;pointer-events:none}
#info{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));font-size:14px;text-shadow:0 1px 4px #000;line-height:1.5;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(255,140,200,.35),rgba(20,10,60,.85));cursor:pointer;padding:16px}
#ov div{text-align:center;max-width:460px}
h1{font-size:clamp(48px,12vw,96px);margin:0;line-height:.95;background:linear-gradient(90deg,#38f5ff,#ff3fd0,#ffc233);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
#ov p{font-size:17px;line-height:1.7;margin:18px 0}
#go{display:inline-block;padding:12px 30px;font:700 22px 'Pixelify Sans',monospace;background:#ffc233;color:#2a1650;border:0;border-radius:8px;box-shadow:0 5px 0 #b57f00;cursor:pointer}
kbd{background:rgba(255,255,255,.18);border-radius:4px;padding:0 6px}

#mpmenu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 30%,rgba(255,140,200,.35),rgba(20,10,60,.92))}
#mpcard{width:min(460px,96vw);padding:24px;background:rgba(20,14,48,.88);border:2px solid rgba(255,255,255,.35);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.45);text-align:center}
#mpcard h2{font-size:34px;margin:0 0 8px;color:#38f5ff}
#mpcard p{font-size:15px;line-height:1.5;color:#eee}
.mpinput{width:100%;padding:12px;margin:6px 0;background:#21194b;color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:7px;font:18px 'Pixelify Sans',monospace;outline:none}
.mpbuttons{display:flex;gap:8px;margin-top:8px}
.mpbtn{flex:1;padding:12px 8px;background:#ffc233;color:#2a1650;border:0;border-radius:7px;box-shadow:0 4px 0 #b57f00;font:700 18px 'Pixelify Sans',monospace;cursor:pointer}
.mpbtn.secondary{background:#38f5ff;box-shadow:0 4px 0 #138eaa}
#mpstatus{min-height:24px;color:#ffc233;font-size:14px;margin-top:12px}
#roomhud{position:fixed;right:12px;top:10px;padding:8px 12px;background:rgba(20,14,48,.65);border:1px solid var(--line);border-radius:8px;font-size:14px;pointer-events:none;text-align:right}
#chatbox{position:fixed;left:12px;bottom:12px;width:min(310px,44vw);pointer-events:none;text-shadow:0 1px 3px #000}
#chatlog{max-height:130px;overflow:hidden;font-size:13px;line-height:1.45}
#chatinput{display:none;width:100%;margin-top:5px;padding:8px;background:rgba(20,14,48,.9);border:1px solid #fff;color:#fff;border-radius:6px;font:14px 'Pixelify Sans',monospace;pointer-events:auto}
@media(max-width:600px){#mpcard{padding:18px}#mpcard h2{font-size:28px}#roomhud{font-size:11px}#chatbox{width:55vw}}

</style></head><body>
<div id="cross"></div><div id="info"></div><div id="name"></div><div id="bar"></div>
<div id="mpmenu"><div id="mpcard">
<h1>Prismland</h1><h2>ONLINE MULTIPLAYER</h2>
<p>Build together in the same world. Create a room or join a friend with a 6-character code.</p>
<input id="playername" class="mpinput" maxlength="16" placeholder="Your player name" value="Player">
<div class="mpbuttons"><button class="mpbtn" id="createRoom">Create world</button></div>
<input id="roomcode" class="mpinput" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase;text-align:center;letter-spacing:5px">
<div class="mpbuttons"><button class="mpbtn secondary" id="joinRoom">Join world</button></div>
<p><kbd>WASD</kbd> move · <kbd>Space</kbd> jump / double-tap to fly · <kbd>C</kbd> descend · <kbd>Shift</kbd> sprint<br>Left click breaks · Right click places · <kbd>T</kbd> changes sky · <kbd>Enter</kbd> chat</p>
<div id="mpstatus">Connecting to multiplayer server...</div>
</div></div>
<div id="roomhud" style="display:none"></div>
<div id="chatbox"><div id="chatlog"></div><input id="chatinput" maxlength="180" placeholder="Message... (Enter to send)"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const ov=document.getElementById('mpmenu');let drag=false;

  scene.add(g);g.position.set(p.x||W/2,p.y||20,p.z||D/2);
  const entry={group:g,target:{x:p.x||W/2,y:p.y||20,z:p.z||D/2,yaw:p.yaw||0},name:p.name||'Player'};
  remotePlayers.set(p.id,entry);updateHud();return entry;
}
function removeRemote(id){const p=remotePlayers.get(id);if(!p)return;scene.remove(p.group);p.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}});remotePlayers.delete(id);updateHud()}
function applyRemoteState(p){const r=makeRemote(p);r.target={x:p.x,y:p.y,z:p.z,yaw:p.yaw||0};}
socket.on('roomJoined',data=>{
  joined=true;roomCode=data.code;myId=data.id;myName=data.name||myName;
  (data.edits||[]).forEach(e=>{set(e.x,e.y,e.z,e.block);rb(e.x,e.z)});
  (data.players||[]).forEach(applyRemoteState);
  updateHud();addChat('Joined room '+roomCode+'. Have fun building!');
  start();
});
socket.on('playerJoined',p=>{applyRemoteState(p);addChat((p.name||'A player')+' joined the world.')});
socket.on('playerMoved',applyRemoteState);
socket.on('playerLeft',p=>{removeRemote(p.id);addChat((p.name||'A player')+' left the world.')});
socket.on('blockChanged',e=>{set(e.x,e.y,e.z,e.block);rb(e.x,e.z)});
socket.on('chatMessage',m=>addChat(m.name+': '+m.text));
socket.on('roomError',m=>setStatus(m));
function enterRoom(kind){
  if(!socket.connected){setStatus('Not connected to server yet. Try again in a moment.');return}
  myName=(nameInput.value.trim()||'Player').slice(0,16);
  if(kind==='create')socket.emit('createRoom',{name:myName});
  else socket.emit('joinRoom',{name:myName,code:codeInput.value.trim().toUpperCase()});
  setStatus('Joining world...');
}
document.getElementById('createRoom').addEventListener('click',e=>{e.stopPropagation();enterRoom('create')});
document.getElementById('joinRoom').addEventListener('click',e=>{e.stopPropagation();enterRoom('join')});
codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&!drag&&joined){ov.style.display='none'}});
document.addEventListener('pointerlockerror',()=>{drag=true;ov.style.display='none'});
document.addEventListener('keydown',e=>{
  if(e.code==='Enter'&&joined){
    if(document.activeElement===chatInput){const t=chatInput.value.trim();if(t)socket.emit('chatMessage',t);chatInput.value='';chatInput.style.display='none';chatInput.blur();R.domElement.requestPointerLock?.()}
    else{chatInput.style.display='block';chatInput.focus();document.exitPointerLock?.();e.preventDefault()}
  }
});
let syncClock=0;

addEventListener('mousemove',e=>{if(document.pointerLockElement){pl.yaw-=e.movementX*.0023;pl.pitch=Math.max(-1.55,Math.min(1.55,pl.pitch-e.movementY*.0023))}});
function ray(){const dx=-Math.sin(pl.yaw)*Math.cos(pl.pitch),dy=Math.sin(pl.pitch),dz=-Math.cos(pl.yaw)*Math.cos(pl.pitch);
let px=-1,py=-1,pz=-1;for(let t=0;t<7;t+=.04){const x=Math.floor(pl.x+dx*t),y=Math.floor(pl.y+1.62+dy*t),z=Math.floor(pl.z+dz*t);
if(get(x,y,z)&&y>=0)return{x,y,z,px,py,pz};px=x;py=y;pz=z}return null}
addEventListener('mousedown',e=>{if(ov.style.display!='none')return;const r=ray();if(!r)return;
if(e.button==0){set(r.x,r.y,r.z,0);rb(r.x,r.z);if(joined)socket.emit('blockChange',{x:r.x,y:r.y,z:r.z,block:0})}
else if(e.button==2&&r.py>=0){set(r.px,r.py,r.pz,HOT[sel]);if(hit(pl.x,pl.y,pl.z))set(r.px,r.py,r.pz,0);else{rb(r.px,r.pz);if(joined)socket.emit('blockChange',{x:r.px,y:r.py,z:r.pz,block:HOT[sel]})}}});
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const info=document.getElementById('info');let last=performance.now(),fps=0;
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;fps=lp(fps,1/dt,.05);
if(K.ArrowLeft)pl.yaw+=dt*2;if(K.ArrowRight)pl.yaw-=dt*2;if(K.ArrowUp)pl.pitch=Math.min(1.55,pl.pitch+dt*1.5);if(K.ArrowDown)pl.pitch=Math.max(-1.55,pl.pitch-dt*1.5);
const sp=(pl.fly?9:4.4)*(K.ShiftLeft?1.8:1);let fx=(K.KeyW?1:0)-(K.KeyS?1:0),sx=(K.KeyD?1:0)-(K.KeyA?1:0);
const l=Math.hypot(fx,sx)||1,s=Math.sin(pl.yaw),c=Math.cos(pl.yaw);
const tx=(-s*fx+c*sx)/l*sp,tz=(-c*fx-s*sx)/l*sp;pl.vx=lp(pl.vx,tx,Math.min(1,dt*12));pl.vz=lp(pl.vz,tz,Math.min(1,dt*12));
if(pl.fly)pl.vy=lp(pl.vy,((K.Space?1:0)-(K.KeyC?1:0))*sp,Math.min(1,dt*10));
else{pl.vy-=28*dt;if(K.Space&&pl.ground)pl.vy=9}
let nx=pl.x+pl.vx*dt;if(!hit(nx,pl.y,pl.z))pl.x=nx;else pl.vx=0;
let nz=pl.z+pl.vz*dt;if(!hit(pl.x,pl.y,nz))pl.z=nz;else pl.vz=0;
let ny=pl.y+pl.vy*dt;pl.ground=false;if(!hit(pl.x,ny,pl.z))pl.y=ny;else{if(pl.vy<0)pl.ground=true;pl.vy=0}
pl.x=Math.max(.5,Math.min(W-.5,pl.x));pl.z=Math.max(.5,Math.min(D-.5,pl.z));if(pl.y<-20){pl.y=30;pl.vy=0}
cam.position.set(pl.x,pl.y+1.62,pl.z);cam.rotation.set(pl.pitch,pl.yaw,0);
syncClock+=dt;
if(joined&&syncClock>=.05){syncClock=0;socket.emit('playerMove',{x:pl.x,y:pl.y,z:pl.z,yaw:pl.yaw,pitch:pl.pitch,fly:pl.fly})}
remotePlayers.forEach(r=>{r.group.position.x=lp(r.group.position.x,r.target.x,.35);r.group.position.y=lp(r.group.position.y,r.target.y,.35);r.group.position.z=lp(r.group.position.z,r.target.z,.35);r.group.rotation.y=r.target.yaw});
sky.position.copy(cam.position);const sp2=SK[sk].p,v=new THREE.Vector3(...sp2).normalize().multiplyScalar(340);sun.position.copy(cam.position).add(v);
clouds.forEach(q=>{q.position.x+=dt*.8;if(q.position.x>260)q.position.x=-60});
const r=ray();hl.visible=!!r;if(r)hl.position.set(r.x+.5,r.y+.5,r.z+.5);
info.textContent=(pl.fly?'Flying':'Walking')+'  |  '+Math.round(fps)+' fps';
R.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
